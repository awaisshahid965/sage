name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Uses the version in .python-version.
      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock is stale, rather than silently resolving
      # something different from what was committed. The `npm ci` equivalent.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Format
        run: uv run poe format-check

      - name: Lint
        run: uv run poe lint

      - name: Typecheck
        run: uv run poe typecheck

      - name: Test
        run: uv run poe test-cov
