[project]
name = "sage"
version = "0.1.0"
description = "An AI assistant, and a playground for practising AI system design"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Muhammad Awais", email = "awaisshahid965@gmail.com" }]

dependencies = [
    "fastapi[standard]>=0.121.0",
    "langchain>=1.0",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "structlog>=25.6.0",
]

[project.scripts]
sage = "sage.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "poethepoet>=0.38.0",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sage"
module-root = "src"


# ---------------------------------------------------------------------------
# Task runner (the equivalent of package.json "scripts").
# Run with:  uv run poe <task>
# ---------------------------------------------------------------------------
[tool.poe.tasks]
dev = "fastapi dev src/sage/main.py"
start = "fastapi run src/sage/main.py"
down = "docker compose down"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src tests"
test = "pytest"
test-cov = "pytest --cov=sage --cov-report=term-missing --cov-report=html"
logprobs = "python -m sage.logprobs"

[tool.poe.tasks.frontend]
help = "Frontend dev server alone, on http://localhost:5173"
# `shell`, not `cmd`. A cmd task execs the program directly, and on Windows npm
# is `npm.cmd` — a shim the exec cannot see, so it fails with "program not
# found". Going through a shell gets PATHEXT resolution and works everywhere.
shell = "npm --prefix frontend run dev"
interpreter = ["pwsh", "powershell", "bash", "sh"]

[tool.poe.tasks.up]
help = "API + Redis in Docker, then the frontend dev server (ctrl-c stops the frontend; `poe down` stops the rest)"
sequence = [
    # Detached, so the sequence can carry on to the frontend. --build is a
    # cached no-op unless the Dockerfile or the lockfile moved, and it means a
    # dependency change cannot leave a stale image behind.
    { cmd = "docker compose up -d --build" },
    # Foreground, holding the terminal — the frontend is the half you are
    # usually watching.
    { ref = "frontend" },
]

[tool.poe.tasks.up-api]
help = "API + Redis in Docker only, logs in the foreground"
cmd = "docker compose up --build"

[tool.poe.tasks.check]
help = "Run every gate CI runs, in the same order"
sequence = ["format-check", "lint", "typecheck", "test"]

[tool.poe.tasks.fix]
help = "Auto-fix everything that can be auto-fixed"
sequence = ["format", "lint-fix"]


# ---------------------------------------------------------------------------
# Ruff = ESLint + Prettier in a single binary.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes            -> no-unused-vars, no-undef
    "I",    # isort               -> import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade           -> modern syntax
    "B",    # flake8-bugbear      -> likely bugs
    "A",    # flake8-builtins     -> no-shadow-restricted-names
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez    -> no naive datetimes
    "T20",  # flake8-print        -> no-console
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # asserts are the whole point of a test
"src/sage/logprobs.py" = ["T20"]  # a CLI, so printing is the job
# Standalone scripts, run by hand. Printing is their whole output. Every other
# rule still applies, so unused imports and real bugs are still caught.
"scripts/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["sage"]

[tool.ruff.format]
docstring-code-format = true


# ---------------------------------------------------------------------------
# mypy = tsc --noEmit. Strict, like a well-configured tsconfig.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/sage"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
